[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogo-match"
version = "0.1.0"
description = "Emparejador local de catálogo (proveedor → maestro de SKUs) con EmbeddingGemma 2: texto e imagen, abstención ('no sé') y sustitución de agotados. Corre 100% on-prem."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ali Cerna" }]
keywords = ["sku", "product-matching", "embeddinggemma", "on-prem", "retail", "entity-resolution"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
# Modelo real (EmbeddingGemma 2). En CPU instala torch desde el índice CPU:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
modelo = [
  "sentence-transformers>=6.1",
  "transformers>=4.56",
  "accelerate>=1.0",
  "torchvision>=0.19",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "httpx>=0.27",
  "pillow>=10.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
catalogo-match = "catalogo_match.cli:main"

[project.urls]
Homepage = "https://github.com/Ali-Cerna-Enciso/catalogo-match"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
