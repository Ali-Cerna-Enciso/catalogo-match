<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Ejemplo de salida de catalogo-match: una consulta sucia se resuelve en un top-3 con decisión y sustituto">
  <rect x="0" y="0" width="900" height="360" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- barra de ventana -->
  <circle cx="26" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="24" r="6" fill="#27c93f"/>
  <text x="88" y="29" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">catalogo-match — emparejar pedidos</text>
  <line x1="0" y1="46" x2="900" y2="46" stroke="#21262d" stroke-width="1.5"/>

  <!-- contenido -->
  <g font-family="ui-monospace, 'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5">

    <text x="28" y="80" fill="#3fb950">$</text>
    <text x="46" y="80" fill="#c9d1d9">catalogo-match emparejar --lote pedidos_proveedor.csv --sustitutos-curados alternativas.csv</text>

    <!-- registro aceptado -->
    <rect x="28" y="98" width="46" height="19" rx="4" fill="#12351f" stroke="#2ea043"/>
    <text x="36" y="112" fill="#3fb950" font-size="12.5">OK</text>
    <text x="86" y="112" fill="#e6edf3">F0001  (0.862)  «YOG GRIEGO FRESA 1KG»</text>

    <text x="52" y="138" fill="#c9d1d9">1) SKU-000123   0.862  Yogurt Griego Fresa | Aurora | 1 kg</text>
    <text x="52" y="162" fill="#8b949e">↳ sustituto: SKU-000124  0.791  Yogurt Griego Fresa | Aurora | 950 g</text>

    <!-- registro a revisión -->
    <rect x="28" y="188" width="46" height="19" rx="4" fill="#3a2d10" stroke="#9e6a03"/>
    <text x="33" y="202" fill="#d29922" font-size="12.5">REV</text>
    <text x="86" y="202" fill="#e6edf3">F0002  (0.671)  «CAJA X12 GASEOSA COLA 1.5L LOTE 4»</text>
    <text x="52" y="228" fill="#c9d1d9">1) SKU-000474   0.671  Gaseosa Cola | NutriVida | 1.5 l</text>

    <!-- registro sin coincidencia -->
    <rect x="28" y="254" width="46" height="19" rx="4" fill="#3c1618" stroke="#da3633"/>
    <text x="33" y="268" fill="#f85149" font-size="12.5">??</text>
    <text x="86" y="268" fill="#e6edf3">F0003  (0.418)  «BEBIDA EN POLVO SABOR MANGO»</text>
    <text x="52" y="294" fill="#8b949e">→ no sé (no hay candidato suficientemente bueno)</text>

    <!-- pie -->
    <text x="28" y="332" fill="#8b949e" font-size="12.5">aceptados: 214 (71%)  |  revisar: 83  |  no sé: 3        datos y modelo: sin salir del servidor</text>
  </g>
</svg>
